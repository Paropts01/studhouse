<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transport | Stud House</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="script.js" defer></script>
</head>
<body>

<header class="site-nav">
  <nav class="nav-inner" aria-label="Main navigation">
    <a href="index.html" class="logo-link" aria-label="Go to home page">
      <img src="assets/official.png" alt="Stud House logo" class="logo">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-links"><i class="fa-solid fa-bars"></i> Menu</button>
    <div class="nav-links" id="primary-links">
      <a href="index.html">Home</a>
      
      <!-- Dropdown Group -->
      <div class="nav-dropdown">
        <button type="button" class="nav-drop-btn">Explore <i class="fa-solid fa-chevron-down"></i></button>
        <div class="nav-dropdown-menu">
          <a href="accommodation.html">Accommodation</a>
          <a href="businesses.html">Businesses</a>
          <a href="transport.html">Transport</a>
          <a href="discounts.html">Student Deals</a>
        </div>
      </div>

      <a href="about_us.html">About Us</a>
      <a href="login.html" id="logout-link">Log Out</a>
    </div>
  </nav>
</header>

<main>
  <section class="page-banner">
    <div class="banner-inner">
      <p class="eyebrow">Getting around</p>
      <h1>Transport</h1>
      <p>Compare the ways students travel to campus. Every card shows the mode, route, price and how often it runs. Click <strong>View details</strong> for the full schedule.</p>
    </div>
  </section>

  <section class="section">
    <form class="filter-panel panel" id="transport-filters" onsubmit="return false;">
      <div class="field">
        <label for="transport-campus">Institution / campus</label>
        <select id="transport-campus" data-institution-select>
          <option value="">Any campus</option>
        </select>
      </div>
      <div class="field">
        <label for="transport-province">Province</label>
        <select id="transport-province">
          <option value="">Any province</option>
          <option>Eastern Cape</option>
          <option>Free State</option>
          <option>Gauteng</option>
          <option>KwaZulu-Natal</option>
          <option>Limpopo</option>
          <option>Mpumalanga</option>
          <option>Northern Cape</option>
          <option>North West</option>
          <option>Western Cape</option>
        </select>
      </div>
      <div class="field">
        <label for="transport-town">Town</label>
        <input type="search" id="transport-town" placeholder="e.g. Braamfontein">
      </div>
      <button class="button button-primary" type="submit">Search</button>
    </form>
  </section>

  <section class="section">
    <div class="section-heading compact-heading">
      <p class="eyebrow">Available options</p>
      <h2>Student transport</h2>
    </div>
    <div class="card-grid" id="transport-grid"></div>
  </section>
</main>

</body>
</html>
